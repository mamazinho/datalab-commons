[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datalab-commons"
version = "0.1.0"
description = "Observabilidade e utilitários compartilhados entre a Datalab API e a Datalab Core API."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "logfire[fastapi,httpx]>=4.41.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-logging>=0.65b0",
    "pydantic>=2.0",
    "pydantic-settings>=2.15.0",
]

[project.optional-dependencies]
# A datalab-api tem banco; a core-api não.
sqlalchemy = ["logfire[sqlalchemy]>=4.41.0"]
# `instrument_agents` só faz sentido em quem roda pydantic-ai.
ai = ["pydantic-ai>=1.62.0"]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff==0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["src/datalab_commons"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# Padrão do ruff (E4/E7/E9 + F) mais isort, warnings e pyupgrade.
# E501 fica de fora de propósito: quem cuida do comprimento é o formatter.
select = ["E4", "E7", "E9", "F", "I", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["datalab_commons"]
